<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sijill — Dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
.escrim{position:fixed;inset:0;background:rgba(17,15,11,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
.escrim.open{display:flex}
.epanel{background:var(--paper);border:1px solid var(--ink);max-width:480px;width:100%;padding:26px;max-height:90vh;overflow:auto}
.row-actions{display:flex;gap:14px;margin-top:6px}
.row-actions .del{margin-top:0}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginView">
  <header class="masthead" style="border:none;padding:0;margin-bottom:24px">
    <div class="mark"><span class="dot"></span><span class="seal">Archivist access</span></div>
    <h1 style="font-size:40px">Dashboard</h1>
  </header>
  <div class="card">
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button class="btn primary" id="loginBtn" style="width:100%">Sign in</button>
    <div class="msg err" id="loginMsg"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashView" style="display:none">
  <header class="masthead">
    <div class="mark"><span class="dot"></span><span class="seal">Archivist access</span></div>
    <h1 style="font-size:clamp(30px,6vw,52px)">Dashboard</h1>
    <p class="coords" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <span><b id="userLine"></b></span>
      <span><a class="btn-solid" href="index.html" style="margin-right:8px">View site</a>
      <button class="btn" id="signOut">Sign out</button></span>
    </p>
  </header>

  <div class="dash">
    <!-- add form -->
    <section class="card">
      <h2>File a photograph</h2>
      <p class="sub">Catalogued and dated</p>
      <div class="drop" id="drop"><span>Choose an image — it previews here</span></div>
      <div class="field"><label>Image file</label><input type="file" id="file" accept="image/*"></div>
      <div class="field"><label>When (month)</label><input type="month" id="fDate"></div>
      <div class="field"><label>Where</label><input id="fPlace" placeholder="e.g. Al-Rimal, Gaza City"></div>
      <div class="field"><label>Caption / context</label><textarea id="fCap" placeholder="A line about what this is."></textarea></div>
      <button class="btn primary" id="fileIt" style="width:100%">File it</button>
      <div class="msg" id="addMsg"></div>

      <div style="border-top:1px solid var(--line);margin-top:24px;padding-top:20px">
        <h2 style="font-size:18px;font-weight:500">Bulk upload</h2>
        <p class="sub" style="margin-bottom:12px">Dates read from filenames · caption &amp; place added later via Edit</p>
        <div class="field"><input type="file" id="bulkFiles" accept="image/*" multiple></div>
        <button class="btn primary" id="bulkGo" style="width:100%">Upload all (B&amp;W)</button>
        <div class="msg" id="bulkMsg"></div>
        <div id="bulkLog" style="font-family:var(--mono);font-size:11px;color:var(--ash);margin-top:8px;line-height:1.7;max-height:160px;overflow:auto"></div>
      </div>
    </section>

    <!-- manage -->
    <section>
      <p class="coords" style="margin-top:0"><b id="mCount">0</b> records on file</p>
      <div class="manage-grid" id="manage"></div>
    </section>
  </div>
</div>

<!-- EDIT PANEL -->
<div class="escrim" id="editScrim">
  <div class="epanel" role="dialog" aria-modal="true" aria-labelledby="eTitle">
    <h2 id="eTitle" style="font-weight:500;font-size:22px;margin-bottom:4px">Edit record</h2>
    <p class="sub" id="eAcc"></p>
    <div class="field"><label>When (month)</label><input type="month" id="eDate"></div>
    <div class="field"><label>Where</label><input id="ePlace" placeholder="e.g. Al-Rimal, Gaza City"></div>
    <div class="field"><label>Caption / context</label><textarea id="eCap" placeholder="A line about what this is."></textarea></div>
    <div class="row-actions" style="margin-top:8px">
      <button class="btn primary" id="eSave">Save changes</button>
      <button class="btn" id="eCancel">Cancel</button>
    </div>
    <div class="msg" id="eMsg"></div>
  </div>
</div>

<!-- Converts iPhone HEIC/HEIF photos to JPEG in the browser -->
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script type="module">
import { auth, db, storage } from "./firebase-init.js";
import { signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { collection, doc, setDoc, updateDoc, getDocs, deleteDoc, runTransaction, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { ref, uploadBytes, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

const $=s=>document.querySelector(s);
let pendingSrc=null;

/* ---- auth ---- */
$('#loginBtn').onclick=async()=>{
  $('#loginMsg').textContent='';
  try{ await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value); }
  catch(e){ $('#loginMsg').textContent='Sign-in failed — check the email and password.'; }
};
$('#signOut').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  if(u){ $('#loginView').style.display='none'; $('#dashView').style.display='block';
    $('#userLine').textContent=u.email; loadManage(); }
  else { $('#loginView').style.display='block'; $('#dashView').style.display='none'; }
});

/* ---- helpers ---- */
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(b);});}
function verifyDecodable(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res();i.onerror=()=>rej(new Error('decode'));i.src=src;});}

/* ---- file preview (handles HEIC, rejects unreadable files) ---- */
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  $('#addMsg').className='msg';$('#addMsg').textContent='';
  const name=(f.name||'').toLowerCase();
  const isHeic=/image\/(heic|heif)/.test(f.type)||/\.(heic|heif)$/.test(name);
  try{
    let blob=f;
    if(isHeic){
      $('#drop').innerHTML='<span>Converting from HEIC…</span>';
      if(typeof heic2any!=='function') throw new Error('heic-lib');
      blob=await heic2any({blob:f,toType:'image/jpeg',quality:0.92});
      if(Array.isArray(blob)) blob=blob[0];
    }
    pendingSrc=await blobToDataURL(blob);
    await verifyDecodable(pendingSrc);          // confirms the browser can actually read it
    $('#drop').innerHTML='<img src="'+pendingSrc+'">';
  }catch(err){
    pendingSrc=null;$('#file').value='';
    $('#drop').innerHTML='<span>This image can’t be read — try JPG or PNG.</span>';
    $('#addMsg').className='msg err';
    $('#addMsg').textContent = err && err.message==='heic-lib'
      ? 'HEIC support didn’t load — check your connection and try again.'
      : 'Unsupported or corrupt image. RAW and TIFF files won’t work — export to JPG first.';
  }
});

/* ---- resize + optional grayscale → Blob ---- */
function processImage(src,bw){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onerror=()=>rej(new Error('decode'));
    img.onload=()=>{
      const max=1600,s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
      const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
      if(bw){const d=ctx.getImageData(0,0,c.width,c.height),p=d.data;
        for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=p[i+1]=p[i+2]=g;}
        ctx.putImageData(d,0,0);}
      c.toBlob(b=>res(b),'image/jpeg',0.88);
    };
    img.src=src;
  });
}

/* ---- accession counter (permanent, never reused) ---- */
async function nextAccession(){
  return await runTransaction(db,async tx=>{
    const cref=doc(db,'meta','counter');const snap=await tx.get(cref);
    const n=(snap.exists()?snap.data().n:0)+1;tx.set(cref,{n});return n;
  });
}

/* ---- file a record ---- */
$('#fileIt').onclick=async()=>{
  if(!pendingSrc){$('#addMsg').className='msg err';$('#addMsg').textContent='Choose an image first.';return;}
  const btn=$('#fileIt');btn.disabled=true;
  $('#addMsg').className='msg';$('#addMsg').textContent='Filing…';
  try{
    const date=$('#fDate').value||'';
    const year=date?date.slice(0,4):'undated';
    const blob=await processImage(pendingSrc,true);
    const n=await nextAccession();
    const acc='GZA·'+String(n).padStart(4,'0');
    const dref=doc(collection(db,'records'));
    const sref=ref(storage,'records/'+dref.id+'/photo.jpg');
    await uploadBytes(sref,blob,{contentType:'image/jpeg'});
    const url=await getDownloadURL(sref);
    await setDoc(dref,{acc,section:'bw',date,year,
      place:$('#fPlace').value.trim()||'—',cap:$('#fCap').value.trim(),
      url,storagePath:sref.fullPath,createdAt:serverTimestamp()});
    $('#addMsg').className='msg ok';$('#addMsg').textContent='Filed as '+acc+'.';
    pendingSrc=null;$('#file').value='';$('#fPlace').value='';$('#fCap').value='';$('#fDate').value='';
    $('#drop').innerHTML='<span>Choose an image — it previews here</span>';
    loadManage();
  }catch(e){
    $('#addMsg').className='msg err';
    $('#addMsg').textContent = e && e.message==='decode'
      ? 'That image couldn’t be processed — try JPG or PNG.'
      : 'Could not file it — check Storage/Firestore rules and your connection.';
  }finally{btn.disabled=false;}
};

/* ---- bulk upload ---- */
function parseDateFromName(name){
  const n=name||'';
  // YYYYMMDD / YYYY-MM-DD / YYYY_MM_DD  (e.g. IMG_20231015_..., IMG-20231015-WA...)
  let m=n.match(/(20\d{2})[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\d|3[01])/);
  if(m) return m[1]+'-'+m[2];
  // YYYY-MM only
  m=n.match(/(20\d{2})[-_.](0[1-9]|1[0-2])(?!\d)/);
  if(m) return m[1]+'-'+m[2];
  return '';
}

async function fileToBWBlob(file){
  const name=(file.name||'').toLowerCase();
  const isHeic=/image\/(heic|heif)/.test(file.type)||/\.(heic|heif)$/.test(name);
  let blob=file;
  if(isHeic){
    if(typeof heic2any!=='function') throw new Error('heic-lib');
    blob=await heic2any({blob:file,toType:'image/jpeg',quality:0.92});
    if(Array.isArray(blob)) blob=blob[0];
  }
  const dataURL=await blobToDataURL(blob);
  await verifyDecodable(dataURL);
  return await processImage(dataURL,true);   // grayscale + resized jpeg
}

$('#bulkGo').onclick=async()=>{
  const files=[...($('#bulkFiles').files||[])];
  if(!files.length){$('#bulkMsg').className='msg err';$('#bulkMsg').textContent='Choose some images first.';return;}
  const btn=$('#bulkGo');btn.disabled=true;
  const log=$('#bulkLog');log.innerHTML='';
  let ok=0,skip=0,undated=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    $('#bulkMsg').className='msg';$('#bulkMsg').textContent='Uploading '+(i+1)+' / '+files.length+'…';
    try{
      const date=parseDateFromName(f.name);
      if(!date) undated++;
      const blob=await fileToBWBlob(f);
      const n=await nextAccession();
      const acc='GZA·'+String(n).padStart(4,'0');
      const dref=doc(collection(db,'records'));
      const sref=ref(storage,'records/'+dref.id+'/photo.jpg');
      await uploadBytes(sref,blob,{contentType:'image/jpeg'});
      const url=await getDownloadURL(sref);
      await setDoc(dref,{acc,section:'bw',date,year:date?date.slice(0,4):'undated',
        place:'—',cap:'',url,storagePath:sref.fullPath,createdAt:serverTimestamp()});
      ok++;
      log.innerHTML+='<div>'+acc+' · '+(date||'undated')+' · '+f.name+'</div>';
    }catch(e){
      skip++;
      log.innerHTML+='<div style="color:var(--safelight)">skipped · '+f.name+'</div>';
    }
    log.scrollTop=log.scrollHeight;
  }
  $('#bulkMsg').className='msg ok';
  $('#bulkMsg').textContent='Done — '+ok+' filed'+(undated?', '+undated+' without a date':'')+(skip?', '+skip+' skipped':'')+'.';
  $('#bulkFiles').value='';btn.disabled=false;
  loadManage();
};

/* ---- manage existing ---- */
let records={};
async function loadManage(){
  const grid=$('#manage');grid.innerHTML='';
  const snap=await getDocs(collection(db,'records'));
  const list=snap.docs.map(d=>({id:d.id,...d.data()}))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  records={};list.forEach(r=>records[r.id]=r);
  $('#mCount').textContent=list.length;
  list.forEach(r=>{
    const el=document.createElement('div');el.className='plate mcard';
    el.innerHTML='<div class="frame"><span class="corner">'+r.acc+'</span><img src="'+r.url+'" alt=""></div>'+
      '<div class="caption"><span class="acc">'+r.acc+'</span><span>'+(r.date?r.date.replace('-','·'):'undated')+'</span></div>'+
      (r.cap?'<div class="note" style="font-size:13px">'+r.cap+'</div>':'')+
      '<div class="row-actions">'+
        '<button class="del edit" data-id="'+r.id+'" style="color:var(--ink)">Edit</button>'+
        '<button class="del remove" data-id="'+r.id+'" data-path="'+(r.storagePath||'')+'" data-acc="'+r.acc+'">Remove</button>'+
      '</div>';
    grid.appendChild(el);
  });
  grid.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEdit(b.dataset.id));
  grid.querySelectorAll('.remove').forEach(b=>b.onclick=async()=>{
    if(!confirm('Remove '+b.dataset.acc+' permanently?'))return;
    try{
      if(b.dataset.path) await deleteObject(ref(storage,b.dataset.path)).catch(()=>{});
      await deleteDoc(doc(db,'records',b.dataset.id));
      loadManage();
    }catch(e){alert('Could not remove it.');}
  });
}

/* ---- edit a record's caption / date / place ---- */
let editId=null;
function openEdit(id){
  const r=records[id];if(!r)return;
  editId=id;
  $('#eAcc').textContent=r.acc;
  $('#eDate').value=r.date||'';
  $('#ePlace').value=(r.place&&r.place!=='—')?r.place:'';
  $('#eCap').value=r.cap||'';
  $('#eMsg').textContent='';$('#eMsg').className='msg';
  $('#editScrim').classList.add('open');
}
function closeEdit(){editId=null;$('#editScrim').classList.remove('open');}
$('#eCancel').onclick=closeEdit;
$('#editScrim').onclick=e=>{if(e.target===$('#editScrim'))closeEdit();};
$('#eSave').onclick=async()=>{
  if(!editId)return;
  const btn=$('#eSave');btn.disabled=true;
  $('#eMsg').className='msg';$('#eMsg').textContent='Saving…';
  try{
    const date=$('#eDate').value||'';
    await updateDoc(doc(db,'records',editId),{
      date, year:date?date.slice(0,4):'undated',
      place:$('#ePlace').value.trim()||'—',
      cap:$('#eCap').value.trim()
    });
    closeEdit();loadManage();
  }catch(e){
    $('#eMsg').className='msg err';$('#eMsg').textContent='Could not save — check your connection and rules.';
  }finally{btn.disabled=false;}
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEdit();});
</script>
</body>
</html>
